<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fridge Chef</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <header>
      <h1>What can I cook tonight?</h1>
      <p>List what's in your fridge. AI will suggest dishes you can make with it.</p>
    </header>

    <section class="fridge" aria-label="Ingredients">
      <div class="shelf" id="shelf">
        <ul id="chips" class="chips" aria-live="polite"></ul>
        <input id="ingredient-input" type="text" autocomplete="off"
               placeholder="Type an ingredient, press Enter" aria-label="Add an ingredient">
      </div>
      <p class="hint" id="hint">Add as many as you like. Click a magnet to remove it.</p>
      <button id="go" type="button" disabled>Find recipes</button>
    </section>

    <p id="status" class="status" role="status" hidden></p>
    <section id="results" aria-live="polite"></section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
